seed: 45
train:
  run_root: runs
  empirical_data_path: data/sample_data.pkl
  model:
    p_ee: 0.16
    weight:
      scales:
        ee: 0.95
        ei: 1.08
  natural_images:
    image_dir: data/vanhateren_iml
    image_shape: [1024, 1536]
    pattern: "*.iml"
    crop_size: 512
    patches_per_image: 8
    limit: null
    preprocess:
      resolution: 128
      normalization: log-zscore
      frame_scale: 0.08
      frame_offset: 1.0
    drive:
      visual_gain: 400.0
      baseline_rate: 0.0
    cache_dir: data/.projection_cache
  solver:
    backend: jax-rk4
    store_trajectory: false
    transfer:
      rate_max: 80.0
  learning:
    kind: bcm
    bcm:
      eta: 5.0e-08
      theta_init: null
      theta_floor: 0.001
      theta_y0: 5.0
      w_max: 30.0
      row_sum_max_scale: 1.05
  background:
    enabled: false
  batch_size: 128
  epochs: 5
  inspection:
    enabled: true
    probe_every: 50
    tracked_weight_count: 8
    save_plots: true
    save_per_batch_arrays: false
simulate:
  run_root: runs
  empirical_data_path: data/sample_data.pkl
  model:
    p_ee: 0.16
    weight:
      scales:
        ee: 0.95
        ei: 1.08
  model_checkpoint: null
  solver:
    backend: jax-rk4
    store_trajectory: true
    transfer:
      rate_max: 80.0
  grating:
    baseline_rate: 0.0
    visual_gain: 315.0
    luminance: 1.0
    contrast: 1.0
    temporal_frequency: 6.283185307179586
    n_orientations: 8
    visual_gain_ramp_duration: 0.1
  trials:
    repeats_per_direction: 8
    shuffle: true
    random_phase: true
    phase_jitter: 0.35
  background:
    enabled: true
    exc:
      mean: 0.0
      stationary_std: 0.02
      tau: 0.05
    inh:
      mean: 0.0
      stationary_std: 0.03
      tau: 0.05
  inspection:
    enabled: true
    save_plots: true
  time:
    start: 0.0
    stop: 0.8
    step: 0.004
