simulation_run: runs/simulate/example
output_run_root: null
save_inputs: true
inspection:
  enabled: true
  save_plots: true
  save_tables: true
  robustness:
    enabled: false
    tail_fractions: [0.25, 0.5, 0.75, 1.0]
    end_times: []
    louvain_parameter_grid: {}
    overlap_surrogates: 0
analysis:
  osi_threshold: 0.0
  filter_by_osi: false
  random_sample_fraction: 1.0
  center_side_fraction: 1.0
  steady_state_fraction: 0.34
  direction_tuning:
    enabled: true
    modulation_threshold: 0.2
  louvain:
    thr_prop: 0.12
    gamma: 0.55
    num_runs: 2
    consensus_tau: 0.5
    consensus_reps: 2
    min_module_degree: 1.0
    min_cluster_size: 1
    similarity_kind: cosine
